name: Release

on:
  push:
    branches: [main]

jobs:
  test-and-publish:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing secret VSCE_PAT. Add a Marketplace PAT in repo Settings → Secrets."
            exit 1
          fi
          npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
