name: Release VS Code

on:
  push:
    branches: [main]

jobs:
  test-and-publish:
    name: Test and publish VS Code extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync-version
      - run: npm test
      - run: npm run build
      - name: Package VSIX
        working-directory: apps/vscode
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Publish to Visual Studio Marketplace (VS Code)
        working-directory: apps/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing secret VSCE_PAT."
            exit 1
          fi
          npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"
