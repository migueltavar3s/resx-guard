name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  test-node:
    name: Node tests and VS Code build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync-version
      - run: npm test
      - run: npm run build

  test-dotnet:
    name: .NET core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: node scripts/sync-version.mjs
      - run: dotnet test apps/visualstudio/ResXGuard.Core.Tests/ResXGuard.Core.Tests.csproj -c Release
